<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PayRenTax">
  <!-- Dark background pill so letters are always legible as a favicon -->
  <rect width="64" height="64" rx="12" fill="#0f172a"/>
  <!-- PRT letters -->
  <text x="4"  y="46" font-family="'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="200" fill="#ffffff" letter-spacing="-1">P</text>
  <text x="24" y="46" font-family="'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="200" fill="#ffffff" letter-spacing="-1">R</text>
  <text x="43" y="46" font-family="'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="200" fill="#ffffff">T</text>
  <!-- Green dot above T -->
  <circle cx="58" cy="10" r="4" fill="#0f6e5b"/>
</svg>
